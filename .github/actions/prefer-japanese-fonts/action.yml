name: Prefer Japanese fonts for CJK glyphs
description: >-
  VRT のスクリーンショットで、日本語の漢字が中国語の字形で描画されないようにする
  （vrt・vrt-admin ジョブで共通）

runs:
  using: composite
  steps:
    # `playwright install --with-deps` は中国語フォント (fonts-wqy-*) と日本語フォント
    # (fonts-ipafont-*) を両方入れるため、fontconfig の既定の優先順位次第で日本語ページの漢字が
    # 中国語の字形で描画されてしまうことがある。Noto Sans CJK JP を追加し、CJK文字は
    # 日本語フォントを優先して使うよう fontconfig を上書きする
    - name: Prefer Japanese fonts for CJK glyphs
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
        sudo tee /etc/fonts/local.conf >/dev/null <<'EOF'
        <?xml version="1.0"?>
        <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
        <fontconfig>
          <match target="pattern">
            <test name="lang" compare="contains"><string>ja</string></test>
            <edit name="family" mode="prepend" binding="strong">
              <string>Noto Sans CJK JP</string>
            </edit>
          </match>
          <alias>
            <family>sans-serif</family>
            <prefer>
              <family>Noto Sans CJK JP</family>
            </prefer>
          </alias>
          <alias>
            <family>serif</family>
            <prefer>
              <family>Noto Serif CJK JP</family>
            </prefer>
          </alias>
        </fontconfig>
        EOF
        sudo fc-cache -f
