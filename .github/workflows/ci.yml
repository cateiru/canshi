name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Type check (admin)
        run: pnpm --filter @canshi/admin typecheck

      - name: Test
        run: pnpm test

      - name: Test (admin)
        run: pnpm --filter @canshi/admin test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    # PR ごとに実行すると Actions の使用量が大きくなるため、壊れたことに気付ければよい
    # という前提で main への push のときだけ実行する
    if: ${{ github.event_name == 'push' }}
    # e2e は next dev に対して直列で実行しており、next dev はページをコンパイルするたびに
    # メモリを使い続ける。1 つのランナーで全件を流すとメモリが上限に達してランナーごと
    # 停止するため、テストを分割して dev サーバー 1 つあたりの担当ページを減らす
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # アプリは日付判定に Asia/Tokyo を使うため、UTC の CI ランナーのまま実行すると
    # 日付境界をまたいだタイミングで「今日」の判定がテストとアプリでずれて flaky になる
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply local D1 migrations
        run: pnpm db:migrate:local

      - name: E2E test
        run: pnpm e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  vrt:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      # アプリは日付判定に Asia/Tokyo を使うため
      TZ: Asia/Tokyo
      S3_BUCKET: cateiru-public-storage
      S3_PATH_PREFIX: canshi/vrt
      REPORT_DOMAIN: storage.cateiru.dev
    steps:
      - uses: actions/checkout@v7
        with:
          # reg-suit (reg-keygen-git-hash-plugin) がベースラインとの比較に
          # git のブランチ履歴を使うため必要
          fetch-depth: 0

      # actions/checkout は pull_request イベントだと detached HEAD で checkout するため、
      # reg-keygen-git-hash-plugin がブランチ名を取得できずエラーになる。
      # 回避策として現在のコミットにブランチ名を付け直す
      # (https://github.com/reg-viz/reg-suit#workaround-for-detached-head)
      - name: Attach HEAD to a branch (reg-suit workaround for detached HEAD)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          git checkout "$BRANCH" || git checkout -b "$BRANCH"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # 日本語の漢字が中国語の字形で描画されないようにする（詳細は action.yml）
      - uses: ./.github/actions/prefer-japanese-fonts

      - name: Apply local D1 migrations
        run: pnpm db:migrate:local

      # VRT が「猫の詳細・記録一覧にデータがあるケース」を実行日時に依存せず
      # 再現するための固定フィクスチャ (e2e/fixtures/vrt-seed.sql 参照)
      - name: Seed VRT fixtures into local D1
        run: pnpm vrt:seed

      - name: Run Playwright tests for VRT
        run: pnpm vrt

      # public-storage-cdk (https://github.com/cateiru/public-storage-cdk) が発行する
      # OIDC ロールを使う。cateiru/* の全リポジトリから AssumeRole 可能
      - name: Configure AWS credentials (public-storage-cdk)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125784910:role/github-actions-public-storage
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Run reg-suit
        run: pnpm exec reg-suit run

      # reg-publish-s3-plugin 自体はオブジェクトタグ付けに対応していないため、
      # アップロード後に auto-expire タグを付け直す
      # (public-storage-cdk 側のライフサイクルルールがこのタグを180日後の自動削除対象にする)
      - name: Tag published snapshots as auto-expire
        run: |
          set -euo pipefail
          KEY="$(git rev-parse HEAD)"
          PREFIX="${S3_PATH_PREFIX}/${KEY}"
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "$PREFIX" \
            --query 'Contents[].Key' --output text \
            | tr '\t' '\n' \
            | grep -v '^$' \
            | xargs -P 8 -I {} aws s3api put-object-tagging \
                --bucket "$S3_BUCKET" --key "{}" \
                --tagging 'TagSet=[{Key=auto-expire,Value=true}]'

      # reg-notify-github-plugin は使わず、hasura/comment-progress で PR にコメントするため
      # 比較結果 (.reg/out.json) から自前でメッセージを組み立てる
      - name: Build VRT summary comment
        id: vrt-summary
        run: |
          set -euo pipefail
          KEY="$(git rev-parse HEAD)"
          REPORT_URL="https://${REPORT_DOMAIN}/${S3_PATH_PREFIX}/${KEY}/index.html"
          FAILED=$(jq '.failedItems | length' .reg/out.json)
          NEW=$(jq '.newItems | length' .reg/out.json)
          DELETED=$(jq '.deletedItems | length' .reg/out.json)
          PASSED=$(jq '.passedItems | length' .reg/out.json)

          {
            echo "## VRT (reg-suit) 結果"
            echo ""
            echo "| ステータス | 件数 |"
            echo "| --- | --- |"
            echo "| 差分あり | ${FAILED} |"
            echo "| 新規 | ${NEW} |"
            echo "| 削除 | ${DELETED} |"
            echo "| 変化なし | ${PASSED} |"
            echo ""
            echo "[reg-suit レポートを見る](${REPORT_URL})"
            if [ "$FAILED" -gt 0 ]; then
              echo ""
              echo "### 差分があったページ"
              echo ""
              jq -r '.failedItems[] | "- " + .' .reg/out.json
            fi
          } > vrt-comment.md

          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          {
            echo "message<<VRT_COMMENT_EOF"
            cat vrt-comment.md
            echo "VRT_COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post VRT result to the pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.pull_request.number }}
          id: vrt-reg-suit
          recreate: true
          message: ${{ steps.vrt-summary.outputs.message }}

      # push イベント (PR がないコミット、例: main への直接反映) では
      # コミットコメントを投稿する権限 (contents: write) を GITHUB_TOKEN に
      # 付与していないため、代わりにジョブサマリーに結果を出す
      - name: Post VRT result to the job summary
        if: ${{ github.event_name == 'push' }}
        run: cat vrt-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if reg-suit detected visual differences
        if: ${{ steps.vrt-summary.outputs.failed != '0' }}
        run: |
          echo "::error::reg-suit detected ${{ steps.vrt-summary.outputs.failed }} visual difference(s). See the report URL in the PR comment or job summary posted above."
          exit 1

  # 管理画面の VRT（vrt-admin）を実行するかを決める。main への push では、reg-suit
  # (reg-keygen-git-hash-plugin) が PR のマージベースのコミットのスナップショットと比較するため、
  # どのコミットにもベースラインがあるよう毎回実行する。PR では管理画面の見た目に関わる
  # ファイルを変えたときだけ実行する
  admin-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - name: Detect changes that affect the admin screens
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 管理画面のコード・VRT の設定とフィクスチャ・マイグレーション（管理画面の SQL が参照する）・
          # 依存関係（Playwright・wrangler・Hono など）・このワークフロー
          PATTERN='^(packages/admin/|e2e-admin/|e2e/vrt-snapshot\.ts$|e2e/fixtures/vrt-seed\.sql$|playwright\.admin-vrt\.config\.ts$|regconfig\.admin\.json$|drizzle/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$|\.github/actions/)'
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' | grep -qE "$PATTERN"; then
            echo "admin=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin=false" >> "$GITHUB_OUTPUT"
          fi

  # 管理画面（packages/admin）の VRT。メインアプリの VRT（vrt）とは別のランナーで実行する。
  # メインアプリの VRT はログインのたびに実行時刻で期限が決まるセッションを D1 に作るため、
  # 同じ D1 で続けて撮ると管理画面のユーザー一覧（セッションの数・期限）が毎回変わってしまう
  vrt-admin:
    needs: admin-changes
    if: ${{ needs.admin-changes.outputs.admin == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      # 管理画面は日時を Asia/Tokyo で表示するが、メインアプリの VRT と条件を揃える
      TZ: Asia/Tokyo
      S3_BUCKET: cateiru-public-storage
      # regconfig.admin.json の pathPrefix と揃える。メインアプリの VRT（canshi/vrt）と
      # 同じコミットのスナップショットを上書きし合わないよう、別の場所にする
      S3_PATH_PREFIX: canshi/vrt-admin
      REPORT_DOMAIN: storage.cateiru.dev
    steps:
      - uses: actions/checkout@v7
        with:
          # reg-suit (reg-keygen-git-hash-plugin) がベースラインとの比較に
          # git のブランチ履歴を使うため必要
          fetch-depth: 0

      # vrt ジョブと同じ、reg-suit の detached HEAD の回避策
      - name: Attach HEAD to a branch (reg-suit workaround for detached HEAD)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          git checkout "$BRANCH" || git checkout -b "$BRANCH"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # 日本語の漢字が中国語の字形で描画されないようにする（詳細は action.yml）
      - uses: ./.github/actions/prefer-japanese-fonts

      - name: Apply local D1 migrations
        run: pnpm db:migrate:local

      # メインアプリの VRT と同じ固定フィクスチャ (e2e/fixtures/vrt-seed.sql 参照)
      - name: Seed VRT fixtures into local D1
        run: pnpm vrt:seed

      - name: Run Playwright tests for admin VRT
        run: pnpm vrt:admin

      - name: Configure AWS credentials (public-storage-cdk)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::211125784910:role/github-actions-public-storage
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Run reg-suit
        run: pnpm vrt:admin:reg

      # vrt ジョブと同じく、アップロード後に auto-expire タグを付ける
      - name: Tag published snapshots as auto-expire
        run: |
          set -euo pipefail
          KEY="$(git rev-parse HEAD)"
          PREFIX="${S3_PATH_PREFIX}/${KEY}"
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "$PREFIX" \
            --query 'Contents[].Key' --output text \
            | tr '\t' '\n' \
            | grep -v '^$' \
            | xargs -P 8 -I {} aws s3api put-object-tagging \
                --bucket "$S3_BUCKET" --key "{}" \
                --tagging 'TagSet=[{Key=auto-expire,Value=true}]'

      # 比較結果は regconfig.admin.json の workingDir（.reg-admin）に出力される
      - name: Build VRT summary comment
        id: vrt-summary
        run: |
          set -euo pipefail
          KEY="$(git rev-parse HEAD)"
          REPORT_URL="https://${REPORT_DOMAIN}/${S3_PATH_PREFIX}/${KEY}/index.html"
          FAILED=$(jq '.failedItems | length' .reg-admin/out.json)
          NEW=$(jq '.newItems | length' .reg-admin/out.json)
          DELETED=$(jq '.deletedItems | length' .reg-admin/out.json)
          PASSED=$(jq '.passedItems | length' .reg-admin/out.json)

          {
            echo "## 管理画面の VRT (reg-suit) 結果"
            echo ""
            echo "| ステータス | 件数 |"
            echo "| --- | --- |"
            echo "| 差分あり | ${FAILED} |"
            echo "| 新規 | ${NEW} |"
            echo "| 削除 | ${DELETED} |"
            echo "| 変化なし | ${PASSED} |"
            echo ""
            echo "[reg-suit レポートを見る](${REPORT_URL})"
            if [ "$FAILED" -gt 0 ]; then
              echo ""
              echo "### 差分があったページ"
              echo ""
              jq -r '.failedItems[] | "- " + .' .reg-admin/out.json
            fi
          } > vrt-admin-comment.md

          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          {
            echo "message<<VRT_COMMENT_EOF"
            cat vrt-admin-comment.md
            echo "VRT_COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      # メインアプリの VRT のコメント（id: vrt-reg-suit）を recreate で消さないよう、別の id にする
      - name: Post VRT result to the pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.pull_request.number }}
          id: vrt-admin-reg-suit
          recreate: true
          message: ${{ steps.vrt-summary.outputs.message }}

      - name: Post VRT result to the job summary
        if: ${{ github.event_name == 'push' }}
        run: cat vrt-admin-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if reg-suit detected visual differences
        if: ${{ steps.vrt-summary.outputs.failed != '0' }}
        run: |
          echo "::error::reg-suit detected ${{ steps.vrt-summary.outputs.failed }} visual difference(s) in the admin screens. See the report URL in the PR comment or job summary posted above."
          exit 1
