name: E2E

# e2e は ci.yml（main への push と、`/e2e` とコメントされた PR）と
# e2e-comment.yml（PR に `/e2e` とコメントされたとき）から呼び出す
on:
  workflow_call:
    inputs:
      ref:
        description: checkout するコミット。省略すると呼び出し元のイベントのコミット
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # e2e は next dev に対して直列で実行しており、next dev はページをコンパイルするたびに
    # メモリを使い続ける。1 つのランナーで全件を流すとメモリが上限に達してランナーごと
    # 停止するため、テストを分割して dev サーバー 1 つあたりの担当ページを減らす
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # アプリは日付判定に Asia/Tokyo を使うため、UTC の CI ランナーのまま実行すると
    # 日付境界をまたいだタイミングで「今日」の判定がテストとアプリでずれて flaky になる
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply local D1 migrations
        run: pnpm db:migrate:local

      - name: E2E test
        run: pnpm e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
