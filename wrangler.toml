name = "canshi"
# OpenNext が生成する `.open-next/worker.js` の fetch ハンドラをラップし、
# `scheduled`（`29` のスケジュール実行）と Workflow クラス、MCP 用 Worker
# （`packages/mcp-server`）向けの RPC エントリーポイント（`McpRpc`）を追加で
# export するカスタムエントリポイント
# （`docs/plans/29_web_push.md`, `docs/plans/32_mcp_oidc_overview.md` 参照）
main = "src/worker.ts"
compatibility_date = "2026-09-06"
# `global_fetch_strictly_public` は MCP の OAuth で CIMD（クライアントの情報を置いた URL）を
# 取得するのに要る（`@cloudflare/workers-oauth-provider`、`src/worker.ts` 参照）
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Worker Previews（`wrangler preview`）の workers.dev の URL を有効にする。
# `wrangler deploy`（本番のデプロイ）のときだけ反映される（`docs/deploy.md` の「プレビュー」節）
preview_urls = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 15分ごとに `scheduled` を起動し、NotificationWorkflow のインスタンスを作る
[triggers]
crons = ["*/15 * * * *"]

[[workflows]]
name = "notification-workflow"
binding = "NOTIFICATION_WORKFLOW"
class_name = "NotificationWorkflow"

[[d1_databases]]
binding = "DB"
database_name = "canshi-db"
# 本番用の database_id は docs/deploy.md の手順で払い出し、デプロイ時に上書きする。
# ローカル開発では wrangler / Miniflare がこの値を使わずローカル SQLite で完結する。
database_id = "1f5e487e-f87e-4896-8190-1ae4f4347ca3"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "canshi-media"

# Workers Logs（ダッシュボードでの呼び出しログ・console 出力の閲覧）
[observability.logs]
enabled = true
invocation_logs = true

# 以前は MCP サーバー本体（`CanshiMcp`, `agents` パッケージの `McpAgent`）がセッション状態を
# Durable Object に保持していた。MCP の 2026-07-28 版の仕様に合わせてセッションを持たない
# 作り（`src/features/mcp/presentation/agent.ts`）にしたため、v2 で Durable Object ごと削除する。
# 適用済みのマイグレーションは消さずに残す
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CanshiMcp"]

[[migrations]]
tag = "v2"
deleted_classes = ["CanshiMcp"]

# Worker Previews（Workers Builds のブランチのビルドで実行する `wrangler preview`）の設定。
# プレビューは上の本番の設定（vars・バインディング・シークレット）を引き継がないため、
# 使うものをここに書き直す。`assets`・`compatibility_*`・`observability` はトップレベルの値が使われる。
# Cron Triggers はプレビューでは動かない（`scheduled` が呼ばれない）ため、Workflow はバインドしない
# （本番の Workflow を共有することになるため）。詳細は `docs/deploy.md` の「プレビュー」節
[previews]

[previews.vars]
# Cloudflare Access（OIDC）を通さず、メールアドレスの入力だけでログインできるようにする
# （`src/features/auth/infrastructure/developmentLogin.ts`）。プレビューの URL は Workers 全体の
# Access で保護し、D1・R2 は本番と分けているため、プレビューに限って有効にする。
# 本番のドメインは Access で保護していないため、トップレベルの `[vars]` には決して書かない
DANGEROUSLY_ENABLE_DEVELOPMENT_LOGIN = "true"

# プレビュー専用の D1。マイグレーションは `pnpm db:migrate:preview`
# （`wrangler.preview-migrations.toml`）で手動で適用する
[[previews.d1_databases]]
binding = "DB"
database_name = "canshi-preview-db"
database_id = "b88bd1c2-3cb6-4eac-b812-a5680ca44202"
migrations_dir = "drizzle"

# プレビュー専用のメディア用バケット
[[previews.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "canshi-media-preview"
