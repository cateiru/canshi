packages:
  - "packages/*"

# アプリ（ルート）と管理画面（packages/admin）の両方で使うパッケージのバージョンは、ここでまとめて決める。
# 各 package.json では "catalog:" と書く。両方で使うパッケージを足すときもここに追加する
# https://pnpm.io/ja/catalogs
catalog:
  "@types/node": ^26.0.0
  "@types/sql.js": ^1.4.11
  drizzle-orm: ^0.45.4
  sql.js: ^1.14.2
  typescript: ^5
  vitest: ^5.0.0
  wrangler: ^4.135.0

allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: false
  unrs-resolver: false
  workerd: true

# Renovate の minimumReleaseAge（3 days）と合わせる。単位は分
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: next@16.4.5
  - next@16.4.5
